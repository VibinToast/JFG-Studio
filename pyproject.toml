[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jfgstudio"
version = "0.1.0"
description = "Level and modpack editor for Jet Force Gemini: Recompiled"
requires-python = ">=3.12"
license = {text = "GPL-2.0-or-later"}
dependencies = [
    "imgui-bundle==1.93.0",
    "moderngl==5.13.0",
    "numpy==2.5.4",
    "platformdirs==4.13.5",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = ["ruff==0.17.2", "pyinstaller"]

[project.scripts]
jfgstudio = "jfgstudio.cli:main"

[tool.setuptools.packages.find]
include = ["jfgstudio*"]

[tool.setuptools.package-data]
jfgstudio = ["schemas/**/*.json", "agent_guide.md"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
