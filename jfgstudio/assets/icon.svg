<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- JFG-Studio's icon: the port's winged emblem redrawn flat and modern, with an editor's grid in its face.
       Original vector art. Rendered to app_settings/icon.png and icon.ico by tools/make_icons.py -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#7FE3FF"/>
      <stop offset="0.45" stop-color="#2E9BF0"/>
      <stop offset="1" stop-color="#1A3FB0"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4D6"/>
      <stop offset="0.5" stop-color="#FFC861"/>
      <stop offset="1" stop-color="#F07A12"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- the emblem: two horns, a flat brow, waist, two wings, a hexagonal eye cut through -->
    <path id="shape" d="M62 12 L102 54 L154 54 L194 12 Q214 110 246 214 L188 180 L68 180 L10 214 Q42 110 62 12 Z"/>
    <path id="eye" d="M94 112 L106 96 L150 96 L162 112 L150 128 L106 128 Z"/>
    <path id="inner" d="M70 40 L96 68 L160 68 L186 40 Q198 112 220 190 L184 166 L72 166 L36 190 Q58 112 70 40 Z"/>
    <mask id="cut">
      <rect width="256" height="256" fill="#fff"/>
      <use href="#eye" fill="#000"/>
    </mask>
    <clipPath id="innerclip"><use href="#inner"/></clipPath>
  </defs>
  <g transform="translate(0 16)">
  <g mask="url(#cut)">
    <!-- a soft shadow, then the rim -->
    <use href="#shape" fill="#030816" opacity="0.45" transform="translate(4 7)" stroke="#030816" stroke-width="14"
         stroke-linejoin="round"/>
    <use href="#shape" fill="url(#rim)" stroke="url(#rim)" stroke-width="14" stroke-linejoin="round"/>
    <use href="#inner" fill="#0B1733" stroke="#0B1733" stroke-width="10" stroke-linejoin="round"/>
    <use href="#inner" fill="url(#face)"/>
    <g clip-path="url(#innerclip)" stroke="#B5530A" stroke-opacity="0.35" stroke-width="2.5" fill="none">
      <!-- the editor's grid across the face, running to a horizon under the eye -->
      <path d="M0 142 H256 M0 152 H256 M0 166 H256 M0 186 H256"/>
      <path d="M128 134 L128 256 M128 134 L98 256 M128 134 L158 256 M128 134 L68 256 M128 134 L188 256
               M128 134 L38 256 M128 134 L218 256 M128 134 L8 256 M128 134 L248 256"/>
    </g>
    <use href="#inner" fill="url(#gloss)" clip-path="url(#innerclip)" transform="translate(0 -6)" opacity="0.8"/>
  </g>
  <!-- the eye's rim -->
  <use href="#eye" fill="none" stroke="#0B1733" stroke-width="9" stroke-linejoin="round"/>
  <use href="#eye" fill="none" stroke="#7FE3FF" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
</svg>
