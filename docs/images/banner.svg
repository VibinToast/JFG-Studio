<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <!-- The README's banner: the icon (jfgstudio/assets/icon.svg) and the name in the JFG font (the port's
       jfg_launcher/JFG-Black.ttf, read at render time, not kept here) over a starfield and an editor grid.
       Original art; rendered to banner.png by tools/make_icons.py -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1733"/>
      <stop offset="1" stop-color="#050B1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.17" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#1E90E8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1E90E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3CC8FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#3CC8FF" stop-opacity="0.45"/>
    </linearGradient>
    <!-- chrome blue, as the port logo's big word; amber for the second -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2FBFF"/>
      <stop offset="0.45" stop-color="#9FE4FF"/>
      <stop offset="0.5" stop-color="#3C9BEF"/>
      <stop offset="1" stop-color="#6FD2FF"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1C2"/>
      <stop offset="0.45" stop-color="#FFC24A"/>
      <stop offset="0.5" stop-color="#F08A12"/>
      <stop offset="1" stop-color="#FFB21A"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <mask id="slice" maskUnits="userSpaceOnUse" x="-20" y="-20" width="876" height="140">
      <rect x="-20" y="-20" width="876" height="140" fill="#fff"/>
      <rect x="-20" y="49" width="876" height="3.5" fill="#000"/>
    </mask>
    <clipPath id="frame"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#sky)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
    <g fill="#E8F3FF">
      <circle cx="420" cy="34" r="1.6" opacity="0.8"/><circle cx="520" cy="290" r="1.1" opacity="0.5"/>
      <circle cx="640" cy="24" r="1.4" opacity="0.7"/><circle cx="760" cy="44" r="1" opacity="0.5"/>
      <circle cx="905" cy="28" r="1.8" opacity="0.8"/><circle cx="1010" cy="40" r="1.2" opacity="0.6"/>
      <circle cx="1120" cy="30" r="1.5" opacity="0.7"/><circle cx="1210" cy="70" r="1.1" opacity="0.5"/>
      <circle cx="1250" cy="150" r="1.4" opacity="0.6"/><circle cx="1180" cy="196" r="1" opacity="0.4"/>
      <circle cx="1150" cy="120" r="1" opacity="0.45"/><circle cx="1230" cy="226" r="1.3" opacity="0.5"/>
      <circle cx="70" cy="30" r="1.3" opacity="0.6"/><circle cx="330" cy="40" r="1" opacity="0.5"/>
      <circle cx="40" cy="250" r="1.1" opacity="0.4"/><circle cx="300" cy="280" r="1.2" opacity="0.4"/>
    </g>
    <!-- the editor's floor grid, running to a horizon -->
    <g stroke="url(#grid)" stroke-width="2" fill="none">
      <path d="M0 256 H1280 M0 272 H1280 M0 292 H1280 M0 318 H1280"/>
      <path d="M640 242 L640 320 M640 242 L520 320 M640 242 L760 320 M640 242 L400 320 M640 242 L880 320
               M640 242 L280 320 M640 242 L1000 320 M640 242 L160 320 M640 242 L1120 320 M640 242 L40 320
               M640 242 L1240 320 M640 242 L-80 320 M640 242 L1360 320"/>
    </g>
    <!-- the icon -->
    <image href="../../jfgstudio/assets/icon.svg" x="56" y="28" width="264" height="264"/>
    <!-- the name, in the JFG font -->
    <!-- the name: lettered by hand (sci-fi capitals with cut corners, a slice through the word; the J after the
         JFG font's), cap height 100 scaled to 96 -->
    <g transform="translate(352 68) scale(0.96)" fill-rule="evenodd" filter="url(#shadow)">
      <g mask="url(#slice)">
        <g fill="#06112A" stroke="#06112A" stroke-width="12" stroke-linejoin="round">
          <path transform="translate(0 0)" d="M0 0 H68 L84 16 V84 L68 100 H16 L0 84 V58 H18 V82 H66 V18 H0 Z"/><path transform="translate(98 0)" d="M0 16 L16 0 H78 V18 H18 V41 H64 V59 H18 V100 H0 Z"/><path transform="translate(190 0)" d="M16 0 H86 V18 H18 V82 H68 V64 H46 V46 H86 V84 L70 100 H16 L0 84 V16 Z"/><path transform="translate(310 0)" d="M16 0 H84 V18 H18 V41 H68 L84 57 V84 L68 100 H0 V82 H66 V59 H16 L0 43 V16 Z"/><path transform="translate(408 0)" d="M0 0 H84 V18 H51 V100 H33 V18 H0 Z"/><path transform="translate(506 0)" d="M0 0 H18 V82 H66 V0 H84 V84 L68 100 H16 L0 84 Z"/><path transform="translate(604 0)" d="M0 0 H66 L86 20 V80 L66 100 H0 Z M18 18 V82 H60 L68 74 V26 L60 18 Z"/><path transform="translate(704 0)" d="M0 0 H18 V100 H0 Z"/><path transform="translate(736 0)" d="M16 0 H70 L86 16 V84 L70 100 H16 L0 84 V16 Z M18 18 V82 H68 V18 Z"/>
        </g>
        <g fill="url(#chrome)" stroke="#D8F6FF" stroke-width="1.6" stroke-linejoin="round">
          <path transform="translate(0 0)" d="M0 0 H68 L84 16 V84 L68 100 H16 L0 84 V58 H18 V82 H66 V18 H0 Z"/><path transform="translate(98 0)" d="M0 16 L16 0 H78 V18 H18 V41 H64 V59 H18 V100 H0 Z"/><path transform="translate(190 0)" d="M16 0 H86 V18 H18 V82 H68 V64 H46 V46 H86 V84 L70 100 H16 L0 84 V16 Z"/>
        </g>
        <g fill="url(#amber)" stroke="#FFEAB0" stroke-width="1.6" stroke-linejoin="round">
          <path transform="translate(310 0)" d="M16 0 H84 V18 H18 V41 H68 L84 57 V84 L68 100 H0 V82 H66 V59 H16 L0 43 V16 Z"/><path transform="translate(408 0)" d="M0 0 H84 V18 H51 V100 H33 V18 H0 Z"/><path transform="translate(506 0)" d="M0 0 H18 V82 H66 V0 H84 V84 L68 100 H16 L0 84 Z"/><path transform="translate(604 0)" d="M0 0 H66 L86 20 V80 L66 100 H0 Z M18 18 V82 H60 L68 74 V26 L60 18 Z"/><path transform="translate(704 0)" d="M0 0 H18 V100 H0 Z"/><path transform="translate(736 0)" d="M16 0 H70 L86 16 V84 L70 100 H16 L0 84 V16 Z M18 18 V82 H68 V18 Z"/>
        </g>
      </g>
    </g>
    <rect x="356" y="194" width="140" height="5" rx="2.5" fill="#FFB21A"/>
    <text x="356" y="238" font-family="'Lato', 'Segoe UI', sans-serif" font-size="30" font-weight="700"
          fill="#8FD8FF" letter-spacing="0.5">Level &amp; modpack editor for Jet Force Gemini: Recomp</text>
    <rect x="1" y="1" width="1278" height="318" rx="23" fill="none" stroke="#1F3D73" stroke-width="2"/>
  </g>
</svg>
